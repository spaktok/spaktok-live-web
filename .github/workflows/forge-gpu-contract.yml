name: Forge GPU Contract Checks (no GPU)
on:
  push:
    branches: [main]
    paths:
      - 'services/forge-gpu/**'
      - 'lib/server/spaktok-forge-provider*'
      - 'app/api/spaktok-forge/gpu-ticket/**'
      - '.github/workflows/forge-gpu-contract.yml'
  pull_request:
    paths:
      - 'services/forge-gpu/**'
      - '.github/workflows/forge-gpu-contract.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python syntax without third-party dependencies
        run: |
          python3 -m py_compile services/forge-gpu/gpu_preflight.py services/forge-gpu/gpu_ticket.py services/forge-gpu/server.py services/forge-gpu/trellis_v1_engine.py services/forge-gpu/trellis2_engine.py services/forge-gpu/one_image_e2e.py services/forge-gpu/one_click_vast_a100.py services/forge-gpu/trellis2_open_rembg.py services/forge-gpu/diagnose_trellis2_conditioning.py services/forge-gpu/trellis2_dinov3_compat.py services/forge-gpu/trellis2_quality.py services/forge-gpu/benchmark_glb_quality.py services/forge-gpu/glb_topology.py services/forge-gpu/glb_uv_surface.py services/forge-gpu/glb_position_weld_audit.py services/forge-gpu/test_glb_position_weld_audit.py services/forge-gpu/test_glb_topology.py services/forge-gpu/test_benchmark_glb_quality.py services/forge-gpu/build_private_lods.py services/forge-gpu/test_build_private_lods.py services/forge-gpu/spaktok_studio_production.py services/forge-gpu/test_spaktok_studio_production.py services/forge-gpu/rodin_blind_benchmark.py services/forge-gpu/test_rodin_blind_benchmark.py services/forge-gpu/wireframe_review_views.py services/forge-gpu/test_wireframe_review_views.py
      - name: Run Blackwell CUDA and direct-ticket contract tests
        working-directory: services/forge-gpu
        run: python3 -m unittest test_gpu_preflight test_gpu_ticket test_trellis_v1_engine test_trellis2_engine test_trellis2_open_rembg test_trellis2_dinov3_compat test_one_image_e2e test_benchmark_glb_quality test_glb_topology test_glb_position_weld_audit test_glb_uv_surface test_build_private_lods test_spaktok_studio_production test_rodin_blind_benchmark test_wireframe_review_views -v
      - name: Validate Vast operator startup script syntax
        run: bash -n services/forge-gpu/start-vast-trellis-v1.sh services/forge-gpu/start-vast-trellis2.sh services/forge-gpu/start-preview-quick-tunnel.sh
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned v2
        with:
          bun-version: 1.3.14
      - name: Install package dependencies
        run: bun install --frozen-lockfile
      - name: Run provider pinning tests
        run: bun run test:forge:providers
