name: Spaktok Platform Main Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    name: Web, API and Studio regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Studio GPU evidence gate (CPU-only)
        working-directory: services/forge-gpu
        run: python3 -m unittest test_verify_gpu_evidence -v
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Confirm Cloudflare-only runtime dependency policy
        run: bun run test:cloudflare-only
      - name: Run full web, API and Studio unit test suite
        run: bun run test
      - name: Validate private Studio Worker security contracts
        run: bun run test:studio:worker
      - name: Run production build with no external deployment
        run: bun run build
