name: Reality Engine Tests
on:
  push:
    branches: [main]
    paths:
      - 'lib/filter-engine/**'
      - '.github/workflows/reality-engine-tests.yml'
  pull_request:
    paths:
      - 'lib/filter-engine/**'
      - '.github/workflows/reality-engine-tests.yml'

permissions:
  contents: read

jobs:
  reality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies using repository lockfile
        run: bun install --frozen-lockfile
      - name: Run Reality Engine and facial anchoring regression tests
        run: bunx vitest run --config vitest.config.ts lib/filter-engine/reality-face-surface.test.ts lib/filter-engine/reality-effect.test.ts lib/filter-engine/reality-effect-audit.test.ts lib/filter-engine/reality-video3d-project.test.ts lib/filter-engine/reality-unified-profile.test.ts lib/filter-engine/reality-live-personal-mesh.test.ts lib/filter-engine/face3d.test.ts lib/filter-engine/reality-pipeline.test.ts lib/filter-engine/reality-gpu2.test.ts lib/filter-engine/lighting3d.test.ts
