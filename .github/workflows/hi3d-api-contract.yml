name: Hi3D API Offline Contract (never pays)
on:
  pull_request:
    paths:
      - 'lib/server/hi3d-api.mjs'
      - 'lib/server/hi3d-api.test.mjs'
      - 'scripts/hi3d-v3-smoke.mjs'
      - '.github/workflows/hi3d-api-contract.yml'
  push:
    branches: [main]
    paths:
      - 'lib/server/hi3d-api.mjs'
      - 'lib/server/hi3d-api.test.mjs'
      - 'scripts/hi3d-v3-smoke.mjs'
      - '.github/workflows/hi3d-api-contract.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check lib/server/hi3d-api.mjs
      - run: node --check scripts/hi3d-v3-smoke.mjs
      - run: node --test lib/server/hi3d-api.test.mjs
