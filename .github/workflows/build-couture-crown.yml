name: Build SpakTok Royal Couture 3D Model
on:
  push:
    paths:
      - scripts/generate_couture_crown.py
      - .github/workflows/build-couture-crown.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: couture-crown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry toolchain
        run: python -m pip install --disable-pip-version-check numpy trimesh pillow
      - name: Generate original GLB jewellery asset
        run: python scripts/generate_couture_crown.py
      - name: Validate model complexity and head anchor
        run: |
          python - <<'PY'
          import trimesh
          from pathlib import Path
          p=Path('public/face-assets/spaktok-royal-couture.glb')
          scene=trimesh.load(p,force='scene')
          faces=sum(len(m.faces) for m in scene.geometry.values())
          print('GLB',p.stat().st_size,'bytes',faces,'triangles',len(scene.geometry),'material groups')
          assert p.stat().st_size>100000
          assert len(scene.geometry)>=6 and faces>10000
          assert scene.bounds[0,1]<-1.1 and scene.bounds[1,1]<-.45
          PY
      - name: Commit generated asset
        run: |
          git config user.name "SpakTok Assets Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/face-assets/spaktok-royal-couture.glb
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "assets(face3d): add detailed original royal couture GLB"
            git push origin HEAD:main
          fi
