name: Forge GPU Contract Checks (no GPU)
on:
  push:
    branches: [main]
    paths:
      - 'services/forge-gpu/**'
      - '.github/workflows/forge-gpu-contract.yml'
  pull_request:
    paths:
      - 'services/forge-gpu/**'
      - '.github/workflows/forge-gpu-contract.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python syntax without third-party dependencies
        run: |
          python3 -m py_compile services/forge-gpu/gpu_preflight.py services/forge-gpu/gpu_ticket.py services/forge-gpu/gpu_health.py services/forge-gpu/trellis1_engine.py services/forge-gpu/trellis2_engine.py services/forge-gpu/glb_quality.py services/forge-gpu/server.py
      - name: Check supervised Vast bootstrap shell syntax
        run: bash -n scripts/vast-a100-trellis1.sh scripts/vast-a100-trellis2.sh
      - name: Run Blackwell CUDA and direct-ticket contract tests
        working-directory: services/forge-gpu
        run: python3 -m unittest test_gpu_preflight test_gpu_ticket test_gpu_health test_trellis1_engine test_trellis2_engine test_glb_quality -v
